name: ニュース更新

on:
  workflow_dispatch:
  schedule:
    - cron: "10 */6 * * *"   # 6時間ごと（日本時間 3:10 / 9:10 / 15:10 / 21:10）

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: ニュースを取得
        run: node scripts/fetch-news.mjs
      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news/data
          git diff --staged --quiet || git commit -m "ニュースを更新 ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
