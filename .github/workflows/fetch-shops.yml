name: 店舗データ更新

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *"   # 毎日 日本時間 4:00 に更新

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 店舗データを取得
        env:
          HOTPEPPER_KEY: ${{ secrets.HOTPEPPER_KEY }}
        run: node scripts/fetch-shops.mjs
      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "店舗データを更新 ($(date -u +%Y-%m-%d))"
          git push
